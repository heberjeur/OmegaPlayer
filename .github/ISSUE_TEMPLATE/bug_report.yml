name: Bug Report
description: Create a report to help us improve OmegaPlayer
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: OmegaPlayer Version
      description: What version of the app are you using?
      placeholder: e.g. 1.2.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android Version
      description: e.g. Samsung Galaxy S21, Android 13
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
    validations:
      required: true
